P=clean(d);pv=isPv?1:0;last=-1;cur=0;prog=fresh();key=null;
if(!isPv){let h=0;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))|0;key=h.toString(36);
try{const sv=JSON.parse(LS.g('tf_boo_'+key)||'null');if(sv&&Number.isInteger(sv.c)&&sv.c>=0&&sv.c<12&&sv.p&&Array.isArray(sv.p.sv)&&Array.isArray(sv.p.ti)&&Array.isArray(sv.p.op)){prog=Object.assign(fresh(),sv.p);cur=sv.c}}catch(e){}const hs=history.state;if(hs&&Number.isInteger(hs.s)&&hs.s>=0&&hs.s<12)cur=hs.s}
$('#b').hidden=true;$('#p').hidden=false;document.title="You've been Boo'd 🕯️";
if(HOK)try{isPv?history.pushState({s:0,d:1},''):history.replaceState({s:cur,d:(history.state&&history.state.d)||0},'')}catch(e){}
render()}
function exitPrev(pop){const d=(history.state&&history.state.d)||0;P=null;pv=0;$('#p').hidden=true;$('#p').innerHTML='';$('#b').hidden=false;document.title='Boo Basket Experience · Tandemfield';renderB();if(!pop&&d)try{history.go(-d)}catch(e){}}
addEventListener('popstate',e=>{if(!P)return;if(e.state&&e.state.s!=null){cur=e.state.s;render()}else if(pv)exitPrev(true)});
addEventListener('hashchange',()=>{if(!pv)location.reload()});
$('#p').addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||!P)return;const a=t.dataset.a,j=+t.dataset.j;
if(a=='next'&&cur<11)go(cur+1,1);
else if(a=='back'&&cur>0){const h=history.state;if(h&&h.s===cur&&h.d>0)history.back();else go(cur-1,0)}
else if(a=='ans'){const k=cur-3;if(j==RID[k][2])prog.sv[k]=1;else(prog.tr[k]=prog.tr[k]||[]).push(j);render()}
else if(a=='show'){prog.sv[cur-3]=1;render()}
else if(a=='choose'){if(prog.ch!==j){prog.ch=j;prog.mv=null;prog.cd=0;prog.ti=[]}go(8,1)}
else if(a=='shuffle'){let n;do{n=Math.floor(Math.random()*MV.length)}while(n===prog.mv);prog.mv=n;render()}
else if(a=='tick'){const i=prog.ti.indexOf(j);i<0?prog.ti.push(j):prog.ti.splice(i,1);t.classList.toggle('ok');t.setAttribute('aria-pressed',i<0);$('#tm').value=tellMsg();if(!pv&&key)LS.s('tf_boo_'+key,JSON.stringify({c:cur,p:prog}))}
else if(a=='card'){prog.cd=(prog.cd+1)%GAME.length;render()}
else if(a=='open'){prog.op[j]=prog.op[j]?0:1;render()}
else if(a=='share'){(async()=>{try{await navigator.share({text:tellMsg()})}catch(x){}})()}
else if(a=='copy')copy($('#tm').value,t,$('#tm'));
else if(a=='restart'){prog=fresh();go(0,1)}
else if(a=='exit')exitPrev(false)});
/* ---------------- BUILDER ---------------- */
const LAB={n:['Their name','e.g. Jordan'],f:['Your name','e.g. Maya'],m:['Your message to them','Two or three sentences. Tap "Use a starter" if you want a head start.'],t:['Teaser line (optional)',DEF.t],c:['Your personal clue','An inside joke or memory that points toward the gift. Only the two of you should get it.'],g:['What the gift is','e.g. Tickets to the haunted trail, plus your favorite candy'],w:['Where or how to find it (optional)','e.g. Waiting in the fridge, behind the milk'],o1:['Open when you miss me',DEF.o1],o2:['Open when you need a laugh',DEF.o2],o3:['Open at midnight',DEF.o3],v:['Movie pick (optional)','Leave blank and they get a shuffle button'],x:['Final note under the gift (optional)',DEF.x],z:['Closing message (optional)',DEF.z]};
const ML={m:1,c:1,o1:1,o2:1,o3:1,x:1,z:1},REQ={n:1,f:1,m:1,c:1,g:1};
const STEPS=[null,['f','n'],['m'],['t','c','g','w'],['o1','o2','o3'],['v','x','z'],null,null];
const TT=['','Who is it from and for?','Your message','The hunt','Open when','Finishing touches'];
const HT=['','Pick one for each side. A group is just one name, like The Girls.','This is the first thing they read after the seal. Make it sound like you.','Clues 1 to 3 are done for you. Clue 4 is yours: make it personal. Then say what the gift is and where it is.','Three short envelopes. Leave any blank to use ours.','All optional. Skip any you like.'];
let D={},bs=0,sm=-1;
try{const x=JSON.parse(LS.g('tf_boo_draft')||'null');if(x){D=clean(x);['a','b'].forEach(k=>{if(D[k]!=='g')D[k]=''})}KEYS.forEach(k=>{if(!D[k])delete D[k]})}catch(e){D={}}
const saveD=()=>LS.s('tf_boo_draft',JSON.stringify(D));
const mk=()=>{if(!HOK)return '';const o={};KEYS.forEach(k=>{const v=(D[k]||'').trim();if(v)o[k]=v});return location.href.split('#')[0]+'#p='+enc(o)};
const nl=k=>{if(k!='n'&&k!='f')return DEF[k]?[LAB[k][0],dflt(k,D)]:LAB[k];const g=k=='f'?D.a=='g':D.b=='g',gr=D.a=='g'&&D.b=='g';return k=='f'?(g?[gr?'Your group name':'Group name','e.g. The Girls']:['Your name','e.g. Maya']):(g?[gr?'Their group name':'Group name','e.g. The Boys']:['Their name','e.g. Jordan'])};
const seg=()=>[['Who is it from?','a',['Just me','A group']],['Who is it for?','b',['One person','A group']]].map(q=>'<div class="fd"><label id="l_'+q[1]+'">'+q[0]+'</label><div class="row" role="group" aria-labelledby="l_'+q[1]+'">'+q[2].map((t,i)=>{const on=(D[q[1]]=='g')==(i==1);return '<button class="opt sg'+(on?' ok':'')+'" data-b="mode" data-k="'+q[1]+'" data-v="'+(i?'g':'')+'" aria-pressed="'+on+'">'+t+'</button>'}).join('')+'</div></div>').join('');
const fld=k=>{const L=nl(k),v=D[k]||'',st=k=='m'||DEF[k];return '<div class="fd"><label for="f_'+k+'">'+L[0]+'</label>'+(ML[k]?'<textarea id="f_'+k+'" data-k="'+k+'" maxlength="'+MAXL[k]+'" rows="4" placeholder="'+E(L[1])+'">'+E(v)+'</textarea>':'<input id="f_'+k+'" data-k="'+k+'" maxlength="'+MAXL[k]+'" placeholder="'+E(L[1])+'" value="'+E(v)+'" autocomplete="off">')+'<div class="rw"><span class="ct" id="c_'+k+'">'+v.length+'/'+MAXL[k]+'</span>'+(st?'<button class="lnk" data-b="st" data-k="'+k+'">Use a starter</button>':'')+'</div></div>'};
function chk(){const n=$('#bn');if(n&&STEPS[bs])n.disabled=!STEPS[bs].every(k=>!REQ[k]||(D[k]||'').trim())}
function renderB(){
let body;
if(bs==0)body='<svg class="hero" viewBox="0 0 360 220" role="img" aria-label="A castle under a blood-red moon"><circle cx="268" cy="78" r="50" fill="url(#bm)"/><use href="#brg" transform="translate(110 -4) scale(.8)" fill="#05030a" stroke="#05030a"/><svg x="0" y="104" width="360" height="116" viewBox="0 0 360 110" preserveAspectRatio="xMidYMax slice"><use href="#cst"/></svg><use href="#bt" transform="translate(36 52)" fill="#10061a" stroke="#d8566a" stroke-width=".9"/></svg><p class="eb" style="text-align:center;margin-top:-4px">TANDEMFIELD PRESENTS</p><h1 class="lock">Halloween Gift</h1><p class="sub" style="text-align:center">A treasure hunt like no other.</p><p class="mut" style="font-size:15px">Turn their Boo Basket into an experience. Personalize it in about 8 minutes, preview it, then send one link. They open it on their phone and follow the clues to the gift.</p><div class="note">Only 5 fields are required. Nothing you type is sent to a server. Your draft is saved on this device only, and the finished link carries your message inside it.</div>'+(Object.keys(D).length?'<button class="lnk" data-b="clr">Clear my saved draft</button>':'');
else if(STEPS[bs])body='<h2>'+TT[bs]+'</h2><p class="mut">'+HT[bs]+'</p>'+(bs==1?seg():'')+STEPS[bs].map(fld).join('');
else if(bs==6)body='<h2>Preview</h2><p class="mut">See it exactly as they will. Nothing is sent.</p><button class="btn" data-b="prev">Preview the experience</button><p class="mut">Tap through every screen. It takes about three minutes.</p>';
else if(!HOK){body='<div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#e0975a" stroke-width="1.7" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></div><h2 style="text-align:center">Link not created</h2><div class="note">You opened this builder from a file on your phone (a <b>file://</b> or <b>content://</b> address), so a recipient link would only work on this device. Open the builder from your hosted <b>https://</b> website address and come back to this step. Drafts are stored separately for each address, so you will need to re-enter your details there. Preview still works here.</div>'}
else{const l=mk();body='<div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#e0975a" stroke-width="1.7" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></div><h2 style="text-align:center">Your gift is ready</h2><p class="mut" style="text-align:center">Send this link. The gift is inside the link itself, so it does not expire.</p><label for="lk">Link</label><textarea id="lk" readonly rows="4">'+E(l)+'</textarea><div class="row"><button class="btn" data-b="copy">Copy link</button>'+(navigator.share?'<button class="btn g" data-b="share">Share</button>':'')+'</div><div class="row"><a class="btn g" href="'+E(l)+'" target="_blank" rel="noopener">Open it like they will</a></div>'+(HOK?'':'<div class="note"><b>Heads up:</b> you opened this builder from a file on your phone, so this link only works on this device. Open the builder from your hosted website address, then create the link again.</div>')+(l.length>3500?'<div class="note">This link is long. If a chat app cuts it off, shorten a message or two.</div>':'')+'<div class="note"><b>About this link:</b> your names and messages are packed inside the link itself. This page stores nothing on a server. Anyone who has the link can read what is inside, so send it only to them. It is not encrypted. Save the link: this page cannot recover it later.</div><div class="note">Tips: open the link yourself first. Text it with "Open this on your phone 👻". Send it the moment you hand over the basket, lights low.</div>'}
$('#b').innerHTML='<div class="bar bh"><span class="br2"><b>T</b>Tandemfield</span><span>Step '+(bs+1)+' of 8</span></div><div class="pg"><i style="width:'+((bs+1)/8*100)+'%"></i></div><main class="sc bm"><div class="in">'+body+'</div></main><div class="ft">'+(bs?'<button class="btn g" data-b="bk">Back</button>':'')+(bs<7?'<button class="btn" id="bn" data-b="nx">'+(bs?'Next':'Start')+'</button>':'')+'</div>';
chk();$('#b .sc').scrollTop=0}
$('#b').addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;D[k]=e.target.value;const c=$('#c_'+k);if(c)c.textContent=D[k].length+'/'+MAXL[k];saveD();chk()});
$('#b').addEventListener('click',e=>{const t=e.target.closest('[data-b]');if(!t)return;const a=t.dataset.b;
if(a=='nx'&&bs<7){bs++;renderB()}
else if(a=='bk'&&bs>0){bs--;renderB()}
else if(a=='st'){const k=t.dataset.k;const A=D.a=='g'?STG:STM;if(k=='m'){sm=(sm+1)%A.length;D.m=sb(A[sm],D)}else D[k]=sb(dflt(k,D),D);const f=$('#f_'+k);f.value=D[k];const c=$('#c_'+k);c.textContent=D[k].length+'/'+MAXL[k];saveD();chk()}
else if(a=='mode'){const k=t.dataset.k,v=t.dataset.v;v?D[k]='g':delete D[k];saveD();renderB();const nb=$('[data-b="mode"][data-k="'+k+'"][data-v="'+v+'"]');if(nb)nb.focus()}
else if(a=='clr'){D={};LS.d('tf_boo_draft');renderB()}
else if(a=='prev'){startP(Object.assign({},D),true)}
else if(a=='copy')copy($('#lk').value,t,$('#lk'));
else if(a=='share'){(async()=>{try{await navigator.share({text:'Open this on your phone 🕯️',url:$('#lk').value})}catch(x){}})()}});
/* ---------------- BOOT ---------------- */
const m=location.hash.match(/^#p=([\w-]+)/);
if(m){const d=dec(m[1]);if(d&&typeof d.n==='string'&&d.n&&typeof d.f==='string'&&d.f)startP(d,false,m[1]);else{document.title="You've been Boo'd 🕯️";$('#p').hidden=false;$('#p').innerHTML='<main class="sc"><div class="in"><h2>This link looks incomplete.</h2><p class="sub">Part of it may have been cut off. Ask the sender to copy and send the full link again.</p></div></main>'}}
else{$('#b').hidden=false;renderB()}
})();
</script>
